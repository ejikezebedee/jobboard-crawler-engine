version: '3.8'

services:
  jobboard-crawler:
    build: .
    container_name: jobboard-crawler
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: jobboard-crawler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data: